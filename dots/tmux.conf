###############################################################################
# BASE ..................................................... Base tmux settings
# UI .............................................................. UI settings
# BINDINGS ....................................................... Key bindings
# HOOKS ........................................................... Event hooks
# PLUGINS ............................................ TPM plugins and settings
# INITIALIZATION  ...................................... Initialization scripts
###############################################################################

###############################################################################
# $BASE
###############################################################################
set -g prefix C-a

set -g extended-keys on
set -g extended-keys-format csi-u

set -g default-terminal "screen-256color"                                     # Upgrade $TERM [1] [2]
set -s escape-time 0                                                          # Vim mode switch delay [3]
set -g display-time 4000                                                      # Increase tmux messages display duration from 750ms to 4s
set -g history-limit 50000                                                    # Increase scrollback buffer size from 2000 to 50000 lines
set -g focus-events on                                                        # Focus events enabled (vim FocusGained/FocusLost)

if-shell -b 'which reattach-to-user-namespace' \
  'set -g default-command "reattach-to-user-namespace -l bash"'               # Fix pbcopy/pbpaste in macOS [4]

###############################################################################
# $UI
###############################################################################
set -g message-style fg=black,bg=white

set -g pane-border-style fg=colour252
set -g pane-active-border-style fg=colour252

set -g status-bg "#e7ffff"
set -g status-fg white
set -g status-justify 'left'
set -g status-left-length 30
set -g status-left '#[default]'
set -g status-right-length 60
set -g status-right '#[default]'                                              # #[default]#[fg=color232]%m/%d/%Y %I:%M %p #[default]'

set -g window-status-format '#[fg=color232]#I #W#[default]'
set -g window-status-current-format '#[fg=color232,bold]*#I #W#[default]'

set-window-option -g clock-mode-colour colour117
set-window-option -g clock-mode-style 12

set-window-option -g mode-keys vi

###############################################################################
# $BINDINGS
###############################################################################
bind C-a last-window
bind c new-window -c "#{pane_current_path}"

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -c "#{pane_current_path}"

bind Tab select-pane -t :.+

bind e setw synchronize-panes
bind k set -g status

bind-key -r H resize-pane -L "5"
bind-key -r J resize-pane -D "5"
bind-key -r K resize-pane -U "5"
bind-key -r L resize-pane -R "5"

bind-key -T copy-mode-vi v send -X begin-selection                            # Visual/copy mode movement [5]
bind-key -T copy-mode-vi V send -X select-line

###############################################################################
# $HOOKS
###############################################################################
set-hook -g pane-focus-in  'run-shell "~/.tmux/plugins/tmux-window-name/scripts/rename_session_windows.py"'
set-hook -g pane-focus-out 'run-shell "~/.tmux/plugins/tmux-window-name/scripts/rename_session_windows.py"'

###############################################################################
# $PLUGINS
###############################################################################
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'kristopolous/tmux-gentrify'

set -g @plugin 'tmux-plugins/tmux-open'
set -g @open-S 'https://www.duckduckgo.com/?q='

set -g @plugin 'ofirgall/tmux-window-name'
set -g @tmux_window_name_ignored_programs "['vim']"
set -g @tmux_window_name_use_tilde "True"

###############################################################################
# $INITIALIZATION
###############################################################################
run '~/.dots/dots/tmux/tpm/tpm'


# [1] https://gist.github.com/paulrouget/1689941#file_.tmux.conf
# [2] https://github.com/richo/dotfiles/blob/master/tmux.conf
# [3] https://stackoverflow.com/questions/12312178/tmux-and-vim-escape-key-being-seen-as-and-having-long-delay/13843382#13843382
# [4] https://savanne.be/804-running-karma-and-chrome-under-tmux-on-osx/
# [5] https://stackoverflow.com/questions/51639540/tmux-scroll-mode-vim-keybindings
